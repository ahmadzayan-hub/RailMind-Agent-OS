name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser script syntax check
        run: node --check web/app.js
      - run: npm run verify
      - name: Static preview smoke test
        run: |
          npm run serve > /tmp/railmind.log 2>&1 &
          PID=$!
          sleep 2
          curl --fail http://127.0.0.1:4173/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/report)" = "401"
          curl --fail -H 'Authorization: Bearer demo-viewer' http://127.0.0.1:4173/api/report | grep -q '"status":"draft"'
          curl --fail -H 'Authorization: Bearer demo-viewer' http://127.0.0.1:4173/api/control-tower | grep -q '"synthetic":true'
          curl --fail http://127.0.0.1:4173/ | grep -q 'data-view="control"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/package.json)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/.env)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/src/demo.ts)" = "404"
          kill $PID
